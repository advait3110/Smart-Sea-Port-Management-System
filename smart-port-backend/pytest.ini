[pytest]
# Only collect tests from the tests/ folder. The project root also has
# standalone manual debug scripts (test_aisstream.py, test_vesselapi.py)
# that are named test_*.py but are NOT pytest tests - they require real
# API keys and call sys.exit()/raise if those aren't set, which crashes
# pytest's collection phase entirely if pytest tries to import them.
testpaths = tests

# tests/ has no __init__.py, so pytest's default import mode only adds
# tests/ itself to sys.path - not the backend root where the "app"
# package lives. This explicitly adds the backend root (where this
# file is) to sys.path so "from app.core.config import settings" etc.
# resolve correctly during test collection.
pythonpath = .
