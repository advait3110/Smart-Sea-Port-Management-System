# =========================================================
# NGINX - Port of Singapore Smart Sea Port
#   /        -> React website
#   /api/... -> FastAPI backend (the /api part is removed)
# =========================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the Nginx version number (security)
    server_tokens off;

    # Allow document uploads up to 25 MB
    client_max_body_size 25m;

    # ---------- Backend API ----------
    location /api/ {
        # Docker's internal address book: finds the backend again
        # even after it restarts with a new internal address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;

        # /api/vessels  ->  /vessels
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ML training and PDF reports can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- React build files (names change every build) ----------
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- React pages ----------
    # Any page address (e.g. /admin/vessels) loads index.html,
    # and React Router shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}